<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Acreditacion — Control de Pulseras</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;             /* Negro mate profundo */
      --card: #141417;           /* Charcoal oscuro */
      --card-inner: #1c1c21;     /* Fondo de inputs */
      --primary: #facc15;        /* Amarillo vibrante */
      --primary-hover: #eab308;  /* Amarillo oscuro */
      --primary-glow: rgba(250, 204, 21, 0.2);
      --accent: #facc15;
      --text: #f8fafc;           /* Blanco limpio */
      --text-dark: #000000;      /* Negro para texto sobre botones amarillos */
      --muted: #94a3b8;          /* Gris texto secundario */
      --border: #27272a;         /* Bordes oscuros sutiles */
      --border-light: #3f3f46;
      --green: #22c55e;          /* Verde neon para acreditacion completada */
      --green-bg: rgba(34, 197, 94, 0.12);
      --green-border: rgba(34, 197, 94, 0.45);
      --pending-bg: #18181b;     /* Fondo oscuro para pendientes */
      --pending-border: rgba(250, 204, 21, 0.35); /* Borde amarillo suave */
      --selected-bg: rgba(250, 204, 21, 0.16);
      --selected-border: #facc15;
      --red: #ef4444;
      --r: 14px;
      --r-sm: 10px;
      --touch: 48px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ===== LOGIN ===== */
    #loginScreen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
      overflow-y: auto;
    }
    #loginScreen.hidden { display: none; }

    .login-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 36px 24px 28px;
      width: 100%; max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 20px rgba(250,204,21,0.05);
    }

    .login-logo {
      width: 80px; height: 80px;
      background: rgba(250, 204, 21, 0.1);
      border: 2px solid var(--primary);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 16px;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.2);
    }

    .login-card h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px; font-weight: 900;
      color: var(--primary); letter-spacing: 1.5px; margin-bottom: 4px;
    }
    .login-card .sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }

    .field-group { margin-bottom: 14px; text-align: left; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.6px; margin-bottom: 7px;
    }
    .field-input {
      width: 100%;
      padding: 0 18px;
      height: var(--touch);
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      outline: none; background: var(--card-inner); color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .field-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(250,204,21,0.15); background: #222228; }
    .field-input.error { border-color: var(--red); }

    .pass-wrap { position: relative; }
    .pass-wrap .field-input { padding-right: 52px; }
    .toggle-pass {
      position: absolute; right: 0; top: 0;
      width: 52px; height: var(--touch);
      background: none; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px; color: var(--muted);
    }

    .error-msg {
      font-size: 12px; color: var(--red);
      min-height: 18px; margin-top: 6px; margin-bottom: 6px;
    }

    .btn-login {
      width: 100%; height: 52px;
      background: var(--primary); color: var(--text-dark);
      border: none; border-radius: var(--r-sm);
      font-size: 16px; font-weight: 900;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer; transition: all 0.2s;
      margin-top: 6px;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-login:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-login:active { transform: scale(0.98); }

    /* ===== APP SHELL ===== */
    #app { display: flex; flex-direction: column; min-height: 100dvh; background: var(--bg); }
    #app.hidden { display: none; }

    /* HEADER — Negro con acento amarillo */
    .app-header {
      background: #000000; color: white;
      padding: 0 14px;
      height: 56px;
      display: flex; align-items: center; gap: 8px;
      position: sticky; top: 0; z-index: 10;
      border-bottom: 2px solid var(--border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .header-info { flex: 1; min-width: 0; }
    .header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 900; letter-spacing: 1.5px;
      color: var(--primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-user {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .stat-chip {
      background: #141417;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      text-align: center; flex-shrink: 0;
      min-width: 48px;
    }
    .stat-chip .n { font-size: 16px; font-weight: 900; line-height: 1; display: block; color: var(--primary); font-family: 'Orbitron', sans-serif; }
    .stat-chip .l { font-size: 9px; font-weight: 600; line-height: 1; color: var(--muted); }

    .icon-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      background: #141417; border: 1px solid var(--border); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; color: var(--primary);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .icon-btn:active { background: #27272a; border-color: var(--primary); }

    .btn-cash-register {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 11.5px;
      letter-spacing: 0.5px;
      padding: 7px 12px;
      border-radius: var(--r-sm);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-cash-register:hover {
      background: #16a34a;
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.45);
    }

    /* SEARCH */
    .search-wrap {
      background: #000000;
      padding: 10px 12px 0;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 56px; z-index: 9;
      flex-shrink: 0;
    }

    .search-inner { position: relative; }
    .search-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); font-size: 17px; pointer-events: none;
      color: var(--primary);
    }
    .search-input {
      width: 100%;
      height: var(--touch);
      padding: 0 46px 0 44px;
      border: 2px solid var(--border); border-radius: 12px;
      font-size: 16px; font-family: 'Inter', sans-serif;
      outline: none; background: var(--card); color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(250,204,21,0.12); }

    .clear-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: var(--border); border: none; border-radius: 50%;
      width: 28px; height: 28px;
      display: none; align-items: center; justify-content: center;
      font-size: 13px; color: var(--muted); cursor: pointer;
    }
    .clear-btn.visible { display: flex; }

    /* FILTER TABS */
    .filter-tabs {
      display: flex; gap: 6px;
      padding: 8px 12px 10px;
      background: #000000; border-bottom: 1px solid var(--border);
      position: sticky; top: 106px; z-index: 8;
      flex-shrink: 0;
    }
    .tab {
      flex: 1; height: 38px;
      border-radius: 8px; border: 1.5px solid var(--border);
      background: var(--card); font-size: 12px; font-weight: 700;
      cursor: pointer; color: var(--muted);
      font-family: 'Inter', sans-serif; transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--text-dark);
      box-shadow: 0 2px 10px rgba(250, 204, 21, 0.25);
    }
    .tab:active { opacity: 0.8; }

    /* LIST */
    .list-container { flex: 1; padding: 10px 12px 140px; }
    .list-count { font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Boton actualizar */
    .refresh-btn {
      display: none; align-items: center; gap: 6px;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 0 14px;
      height: 36px; font-size: 12px; font-weight: 700; color: var(--primary);
      cursor: pointer; font-family: 'Inter', sans-serif;
      margin-bottom: 10px; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .refresh-btn.show { display: inline-flex; }
    .refresh-btn:hover { border-color: var(--primary); background: rgba(250,204,21,0.08); }
    .refresh-btn:active { opacity: 0.7; }
    .refresh-btn.spinning span { animation: spin 0.8s linear infinite; display: inline-block; }

    /* CARDS */
    .person-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--r);
      min-height: 64px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }
    .person-card:active { opacity: 0.8; transform: scale(0.99); }
    
    /* Pendiente: Fondo oscuro con borde amarillo sutil */
    .person-card.pendiente {
      background: var(--pending-bg);
      border-color: var(--pending-border);
    }
    
    /* Seleccionada: Resaltado amarillo brillante */
    .person-card.selected {
      background: var(--selected-bg);
      border-color: var(--selected-border);
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.15);
    }
    
    /* Entregada: Tinte verde tecnologico */
    .person-card.entregada {
      background: var(--green-bg);
      border-color: var(--green-border);
      cursor: default;
    }

    /* Checkbox */
    .checkbox {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: 9px; border: 2px solid var(--border-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; background: var(--card-inner);
      transition: all 0.15s;
    }
    .person-card.selected .checkbox {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--text-dark);
      box-shadow: 0 0 10px rgba(250,204,21,0.4);
    }
    .person-card.entregada .checkbox {
      background: var(--green);
      border-color: var(--green);
      color: #000000;
    }

    .person-info { flex: 1; min-width: 0; }
    .person-name {
      font-size: 15px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.3;
    }
    .person-meta {
      font-size: 12px; color: var(--muted); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .delivery-info { font-size: 11px; color: var(--green); margin-top: 3px; font-weight: 600; }

    .person-tag {
      font-size: 10px; font-weight: 800;
      padding: 4px 9px; border-radius: 999px; flex-shrink: 0;
      letter-spacing: 0.5px; white-space: nowrap;
    }
    .tag-pending { background: rgba(250, 204, 21, 0.12); color: var(--primary); border: 1px solid rgba(250, 204, 21, 0.4); }
    .tag-done { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }

    /* ESTADOS VACIOS */
    .loading-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px 20px; gap: 14px; color: var(--muted);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; padding: 80px 24px; color: var(--muted); }
    .empty-state .ico { font-size: 52px; margin-bottom: 14px; }
    .empty-state p { font-size: 15px; line-height: 1.7; }

    /* PAGINACION */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 12px; padding: 16px 12px;
    }
    .page-btn {
      height: var(--touch); padding: 0 20px;
      border-radius: 8px; border: 1.5px solid var(--border);
      background: var(--card); font-size: 13px; font-weight: 700;
      cursor: pointer; color: var(--text);
      font-family: 'Inter', sans-serif; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-btn:not(:disabled):hover { border-color: var(--primary); color: var(--primary); }
    .page-btn:not(:disabled):active { background: rgba(250,204,21,0.1); }
    .page-info { font-size: 12px; color: var(--muted); font-weight: 600; }

    /* ===== FAB BAR — boton de entrega ===== */
    .fab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #000000;
      border-top: 2px solid var(--primary);
      padding: 12px 16px env(safe-area-inset-bottom, 12px);
      z-index: 20;
      transform: translateY(110%);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 -8px 25px rgba(0,0,0,0.8), 0 0 20px rgba(250, 204, 21, 0.1);
    }
    .fab-bar.visible { transform: translateY(0); }

    .fab-inner {
      max-width: 500px; margin: 0 auto;
      display: flex; align-items: center; gap: 10px;
    }

    .fab-count { flex-shrink: 0; text-align: center; min-width: 40px; }
    .fab-count .n { font-size: 24px; font-weight: 900; color: var(--primary); line-height: 1; font-family: 'Orbitron', sans-serif; }
    .fab-count .l { font-size: 9px; color: var(--muted); font-weight: 700; text-transform: uppercase; }

    .btn-deliver {
      flex: 1; height: 54px;
      background: var(--primary); color: var(--text-dark);
      border: none; border-radius: var(--r-sm);
      font-size: 16px; font-weight: 900;
      font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    .btn-deliver:hover { background: var(--primary-hover); }
    .btn-deliver:active { transform: scale(0.98); }
    .btn-deliver:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-cancel-sel {
      height: 54px; padding: 0 16px;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--r-sm); font-size: 16px; font-weight: 700;
      cursor: pointer; color: var(--muted);
      font-family: 'Inter', sans-serif; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    .btn-cancel-sel:hover { border-color: var(--red); color: var(--red); }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #18181b; color: white;
      border: 1px solid var(--border);
      padding: 13px 22px; border-radius: 14px;
      font-size: 14px; font-weight: 700;
      white-space: nowrap; opacity: 0;
      transition: all 0.28s; z-index: 40;
      max-width: calc(100vw - 32px);
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: #052e16; border-color: var(--green); color: #86efac; }
    .toast.error   { background: #450a0a; border-color: var(--red); color: #fca5a5; }

    /* ===== MODAL SETTINGS ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 50; display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.hidden { display: none; }

    .modal {
      background: #141417;
      border: 1px solid var(--border);
      border-top: 2px solid var(--primary);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      width: 100%; max-width: 540px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
      animation: slideUpM 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes slideUpM {
      from { transform: translateY(50px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .modal-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: var(--border-light); margin: 0 auto 20px;
    }
    .modal h3 { font-size: 17px; font-weight: 900; margin-bottom: 18px; color: var(--primary); font-family: 'Orbitron', sans-serif; }
    .modal-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 6px; display: block;
    }
    .modal-input {
      width: 100%; height: var(--touch);
      padding: 0 16px; border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 15px; font-family: 'Inter', sans-serif; outline: none;
      margin-bottom: 14px; background: var(--card-inner); color: var(--text);
      transition: border-color 0.2s; -webkit-appearance: none;
    }
    .modal-input:focus { border-color: var(--primary); }
    .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
    .btn-modal-save {
      flex: 1; height: var(--touch);
      background: var(--primary); color: var(--text-dark);
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 900; cursor: pointer;
      font-family: 'Orbitron', sans-serif;
    }
    .btn-modal-cancel {
      height: var(--touch); padding: 0 18px;
      background: transparent; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 14px; cursor: pointer;
      color: var(--muted); font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🎫</div>
    <h1>ACREDITACION</h1>
    <p class="sub">Control de Acceso & Pulseras</p>

    <div class="field-group">
      <label class="field-label" for="colabName">Tu nombre</label>
      <input class="field-input" id="colabName" type="text"
        placeholder="Ej: Juan — Puerta Norte"
        autocomplete="off" autocorrect="off" autocapitalize="words" />
    </div>

    <div class="field-group">
      <label class="field-label" for="passInput">Contrasena del evento</label>
      <div class="pass-wrap">
        <input class="field-input" id="passInput" type="password"
          placeholder="••••••••" autocomplete="off" />
        <button class="toggle-pass" onclick="togglePass()" type="button" aria-label="Ver contrasena">👁</button>
      </div>
    </div>

    <div class="error-msg" id="loginError"></div>
    <button class="btn-login" onclick="doLogin()">Ingresar →</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">

  <!-- Header -->
  <header class="app-header">
    <div class="header-info">
      <div class="header-title">🎫 PULSERAS</div>
      <div class="header-user" id="headerUser"></div>
    </div>
    <div class="stat-chip">
      <span class="n" id="statEntregadas">-</span>
      <span class="l">entregadas</span>
    </div>
    <div class="stat-chip">
      <span class="n" id="statPendientes">-</span>
      <span class="l">pendientes</span>
    </div>
    <button class="btn-cash-register" onclick="openCobroPuertaModal()" title="Cobro en Puerta / Anotar Persona en Efectivo">💵 Cobro Efectivo</button>
    <button class="icon-btn" onclick="openSettings()" aria-label="Configuracion" title="Configuración">⚙️</button>
    <button class="icon-btn" onclick="cerrarSesionAcred('manual')" aria-label="Cerrar Sesion" title="Cerrar Sesión" style="color: #ef4444;">🚪</button>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-inner">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="search"
        placeholder="Buscar por nombre..." autocomplete="off"
        autocorrect="off" autocapitalize="off" />
      <button class="clear-btn" id="clearBtn" onclick="clearSearch()" aria-label="Limpiar">✕</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="filter-tabs">
    <button class="tab active" id="tabAll"     onclick="setFilter('all')">Todos</button>
    <button class="tab"        id="tabPending" onclick="setFilter('pending')">⏳ Pendientes</button>
    <button class="tab"        id="tabDone"    onclick="setFilter('done')">✅ Entregadas</button>
  </div>

  <!-- List -->
  <div class="list-container" id="listContainer">
    <div class="loading-wrap" id="loadingWrap">
      <div class="spinner"></div>
      <p>Cargando asistentes...</p>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">
      <span>↺</span> Actualizar lista
    </button>
    <div id="personList"></div>
    <div class="pagination" id="paginationWrap" style="display:none">
      <button class="page-btn" id="btnPrev" onclick="changePage(-1)">← Anterior</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="page-btn" id="btnNext" onclick="changePage(1)">Siguiente →</button>
    </div>
  </div>

  <!-- FAB bar -->
  <div class="fab-bar" id="fabBar">
    <div class="fab-inner">
      <div class="fab-count">
        <div class="n" id="fabCount">0</div>
        <div class="l">selec.</div>
      </div>
      <button class="btn-deliver" id="btnDeliver" onclick="entregarSeleccionados()">
        ✅ Entregar Pulsera(s)
      </button>
      <button class="btn-cancel-sel" onclick="clearSelection()">✕</button>
    </div>
  </div>

</div>

<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>👤 Configuración de Colaborador</h3>

      placeholder="Ej: Juan — Puerta Norte" autocapitalize="words" />
    <div class="modal-btns">

      <button class="btn-modal-save" onclick="saveSettings()">Guardar</button>

        🚪 Cerrar Sesión
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="alert"></div>

<script>
  // ===== CONFIG — MULTI-EVENTO UNIFICADO =====
  // Un solo script maneja ambas planillas
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGxkaGj-fiOd3W5H-5TuRYFHkxzmo-ud0Ck8Wdr5bXCKuIQwmMT-DGnRg6ncMrJXnI-Q/exec";
  const EVENTOS = {
    "EXTHOMBRES2026": {
      clave: "EXTHOMBRES",
      nombre: "Extiendete de Hombres 2026"
    },
    "LUMINATE2026": {
      clave: "LUMINATE",
      nombre: "Luminate 2026"
    }
  };
  const TOKEN = "ACRED_EXTIENDETE_2026";

  let EVENTO_CLAVE = "EXTHOMBRES";
  let EVENTO_NOMBRE = "";
  let COLAB_NAME = sessionStorage.getItem("acred_colab") || "";

  // ===== STATE =====
  let allPersons = [];
  let filteredPersons = [];
  let selectedIds = new Set();
  let currentPage = 1;
  const PER_PAGE = 50;
  let currentFilter = "all";
  let searchDebounce = null;
  let isSearchMode = false;
  let estadisticas = { totalEntregadas: 0, totalPendientes: 0 };

  // ===== CONTROL DE INACTIVIDAD (30 MINUTOS) =====
  let acredInactivityTimer = null;
  const ACRED_INACTIVITY_LIMIT_MS = 30 * 60 * 1000; // 30 minutos

  function initAcredInactivityTracker() {
    if (!sessionStorage.getItem("acred_colab")) return;

    const resetTimer = () => {
      if (acredInactivityTimer) clearTimeout(acredInactivityTimer);
      acredInactivityTimer = setTimeout(onAcredInactivityTimeout, ACRED_INACTIVITY_LIMIT_MS);
    };

    const activityEvents = ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'pointerdown', 'click'];
    activityEvents.forEach(evt => {
      window.addEventListener(evt, resetTimer, { passive: true });
    });

    resetTimer();
  }

  function onAcredInactivityTimeout() {
    cerrarSesionAcred('inactivity');
  }

  function cerrarSesionAcred(reason) {
    if (acredInactivityTimer) {
      clearTimeout(acredInactivityTimer);
      acredInactivityTimer = null;
    }
    // Limpieza estricta de almacenamiento
    sessionStorage.removeItem("acred_colab");
    sessionStorage.removeItem("acred_evento_clave");
    sessionStorage.removeItem("acred_evento_nombre");
    sessionStorage.removeItem("acred_logged");
    localStorage.removeItem("acred_colab");

    // Destrucción total de estado en memoria
    allPersons = [];
    filteredPersons = [];
    selectedIds.clear();
    COLAB_NAME = "";
    EVENTO_CLAVE = "EXTHOMBRES";
    EVENTO_NOMBRE = "";
    estadisticas = { totalEntregadas: 0, totalPendientes: 0 };
    isSearchMode = false;
    currentPage = 1;

    // Limpieza de DOM y campos de entrada
    const personList = document.getElementById("personList");
    if (personList) personList.innerHTML = "";
    const passInp = document.getElementById("passInput");
    if (passInp) passInp.value = "";
    const searchInp = document.getElementById("searchInput");
    if (searchInp) searchInp.value = "";
    const headerUser = document.getElementById("headerUser");
    if (headerUser) headerUser.textContent = "";
    const statE = document.getElementById("statEntregadas");
    if (statE) statE.textContent = "-";
    const statP = document.getElementById("statPendientes");
    if (statP) statP.textContent = "-";

    document.getElementById("app").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");

    if (reason === 'inactivity') {
      showToast("⏳ Sesión cerrada por inactividad (30 min).", "warning");
    } else {
      showToast("Sesión cerrada correctamente.", "info");
    }
  }

  // Protección contra navegación histórica (BFCache / Botón Atrás)
  window.addEventListener('pageshow', function() {
    if (!sessionStorage.getItem("acred_colab")) {
      document.getElementById("app").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    }
  });

  document.addEventListener("DOMContentLoaded", function() {
    localStorage.removeItem("acred_colab");
    if (sessionStorage.getItem("acred_colab") && sessionStorage.getItem("acred_logged") === "true") {
      COLAB_NAME = sessionStorage.getItem("acred_colab");
      EVENTO_CLAVE = sessionStorage.getItem("acred_evento_clave") || "EXTHOMBRES";
      EVENTO_NOMBRE = sessionStorage.getItem("acred_evento_nombre") || "Extiendete de Hombres 2026";
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("headerUser").textContent = COLAB_NAME + " · " + EVENTO_NOMBRE;
      initAcredInactivityTracker();
      loadAll();
    }
  });

  // ===== LOGIN =====
  function togglePass() {
    var inp = document.getElementById("passInput");
    inp.type = inp.type === "password" ? "text" : "password";
  }

  function doLogin() {
    var pass  = document.getElementById("passInput").value.trim().toUpperCase();
    var name  = document.getElementById("colabName").value.trim();
    var errEl = document.getElementById("loginError");

    if (!name) {
      errEl.textContent = "Ingresa tu nombre antes de continuar.";
      document.getElementById("colabName").focus();
      return;
    }

    var evento = EVENTOS[pass];
    if (!evento) {
      errEl.textContent = "Contrasena incorrecta. Intenta de nuevo.";
      document.getElementById("passInput").value = "";
      document.getElementById("passInput").focus();
      return;
    }

    EVENTO_CLAVE = evento.clave;
    EVENTO_NOMBRE = evento.nombre;
    COLAB_NAME = name;
    sessionStorage.setItem("acred_colab", name);
    sessionStorage.setItem("acred_evento_clave", evento.clave);
    sessionStorage.setItem("acred_evento_nombre", evento.nombre);
    sessionStorage.setItem("acred_logged", "true");
    localStorage.removeItem("acred_colab");
    errEl.textContent = "";
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("headerUser").textContent = name + " · " + EVENTO_NOMBRE;
    initAcredInactivityTracker();
    loadAll();
  }

  // ===== COBRO EN PUERTA / ANOTAR EN EFECTIVO (Requiere contraseña IARAHACKER26) =====
  function openCobroPuertaModal() {
    document.getElementById("cpNombre").value = "";
    document.getElementById("cpCiudad").value = "";
    document.getElementById("cpTelefono").value = "";
    document.getElementById("cpTipo").value = "ENTRADA GENERAL";
    document.getElementById("cpEntregarPulsera").checked = true;
    document.getElementById("cpAuthPass").value = "";
    document.getElementById("cpError").textContent = "";
    document.getElementById("cobroPuertaModal").classList.remove("hidden");
    setTimeout(function() { document.getElementById("cpNombre").focus(); }, 250);
  }

  function closeCobroPuertaModal() {
    document.getElementById("cobroPuertaModal").classList.add("hidden");
  }

  function togglePassCobro() {
    var inp = document.getElementById("cpAuthPass");
    inp.type = inp.type === "password" ? "text" : "password";
  }

  async function guardarCobroPuerta() {
    var nombre = document.getElementById("cpNombre").value.trim();
    var ciudad = document.getElementById("cpCiudad").value.trim();
    var telefono = document.getElementById("cpTelefono").value.trim();
    var tipo = document.getElementById("cpTipo").value.trim();
    var entregarPulsera = document.getElementById("cpEntregarPulsera").checked;
    var authPass = document.getElementById("cpAuthPass").value.trim().toUpperCase();
    var errEl = document.getElementById("cpError");
    var btnSave = document.getElementById("btnSaveCobro");

    errEl.textContent = "";

    if (!nombre) {
      errEl.textContent = "⚠️ Ingresa el nombre y apellido.";
      document.getElementById("cpNombre").focus();
      return;
    }

    // EXIGIR OBLIGATORIAMENTE LA CONTRASEÑA "IARAHACKER26"
    if (authPass !== "IARAHACKER26") {
      errEl.textContent = "❌ Contraseña de autorización incorrecta.";
      document.getElementById("cpAuthPass").value = "";
      document.getElementById("cpAuthPass").focus();
      return;
    }

    btnSave.disabled = true;
    btnSave.textContent = "Guardando en planilla... ⏳";

    try {
      var payload = {
        action: "registrarEfectivo",
        nombre: nombre,
        ciudad: ciudad || "San Nicolás",
        telefono: telefono || "",
        tipo: tipo,
        autoAcreditar: entregarPulsera,
        colaborador: COLAB_NAME || "Puerta",
        authPass: authPass,
        adminPassword: authPass
      };

      var res = await callScript(payload);

      if (res.ok) {
        showToast("✅ " + (res.mensaje || "Persona registrada y guardada exitosamente."), "success");
        closeCobroPuertaModal();
        await loadAll();
      } else {
        errEl.textContent = "❌ Error: " + (res.error || "No se pudo registrar.");
      }
    } catch (err) {
      console.error(err);
      errEl.textContent = "❌ Error de conexión al guardar.";
    } finally {
      btnSave.disabled = false;
      btnSave.textContent = "💾 Guardar Registro";
    }
  }

  document.getElementById("cobroPuertaModal").addEventListener("click", function(e) {
    if (e.target === this) closeCobroPuertaModal();
  });

  document.getElementById("passInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") doLogin();
  });
  document.getElementById("colabName").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("passInput").focus();
  });

  // ===== SETTINGS =====
  function openSettings() {
    document.getElementById("colabNameModal").value = COLAB_NAME;
    document.getElementById("settingsModal").classList.remove("hidden");
  }
  function closeSettings() {
    document.getElementById("settingsModal").classList.add("hidden");
  }
  function saveSettings() {
    var name = document.getElementById("colabNameModal").value.trim();
    if (name) {
      COLAB_NAME = name;
      sessionStorage.setItem("acred_colab", name);
      document.getElementById("headerUser").textContent = name + " · " + EVENTO_NOMBRE;
    }
    closeSettings();
    showToast("Nombre actualizado ✓", "success");
  }
  document.getElementById("settingsModal").addEventListener("click", function(e) {
    if (e.target === this) closeSettings();
  });

  // ===== SEARCH =====
  document.getElementById("searchInput").addEventListener("input", function() {
    var val = this.value.trim();
    document.getElementById("clearBtn").classList.toggle("visible", val.length > 0);
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function() {
      currentPage = 1;
      isSearchMode = val.length > 0;
      if (isSearchMode) buscarEnServidor(val);
      else applyFilterAndRender();
    }, 350);
  });

  function clearSearch() {
    document.getElementById("searchInput").value = "";
    document.getElementById("clearBtn").classList.remove("visible");
    currentPage = 1; isSearchMode = false;
    applyFilterAndRender();
  }

  // ===== FILTERS =====
  function setFilter(f) {
    currentFilter = f; currentPage = 1;
    document.getElementById("tabAll").classList.toggle("active", f === "all");
    document.getElementById("tabPending").classList.toggle("active", f === "pending");
    document.getElementById("tabDone").classList.toggle("active", f === "done");
    applyFilterAndRender();
  }

  // ===== DATA =====
  async function loadAll() {
    if (!SCRIPT_URL) return;
    showLoading();
    try {
      var res = await callScript({ action: "listar", pagina: 1, porPagina: 9999 });
      if (res.ok) {
        allPersons = res.resultados;
        estadisticas = res.estadisticas;
        updateStats();
        applyFilterAndRender();
        document.getElementById("refreshBtn").classList.add("show");
      } else {
        showError("Error al cargar: " + (res.error || "desconocido"));
      }
    } catch (e) {
      showError("No se pudo conectar al servidor.<br>Verifica la conexion a internet.");
    }
  }

  async function refreshData() {
    var btn = document.getElementById("refreshBtn");
    btn.classList.add("spinning"); btn.disabled = true;
    await loadAll();
    btn.classList.remove("spinning"); btn.disabled = false;
    showToast("Lista actualizada ✓", "success");
  }

  async function buscarEnServidor(q) {
    if (!SCRIPT_URL) return;
    showLoading();
    try {
      var res = await callScript({ action: "buscar", query: q });
      if (res.ok) renderPersons(res.resultados, true);
      else showError(res.error || "Error en busqueda");
    } catch(e) { showError("Error de conexion."); }
  }

  function applyFilterAndRender() {
    var list = allPersons.slice();
    if (currentFilter === "pending") list = list.filter(function(p){ return !p.entregada; });
    if (currentFilter === "done")    list = list.filter(function(p){ return  p.entregada; });
    filteredPersons = list;
    renderPersons(list, false);
  }

  // ===== RENDER =====
  function renderPersons(list, searchMode) {
    hideLoading();
    var container = document.getElementById("personList");
    var pagWrap   = document.getElementById("paginationWrap");

    if (!list || list.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="ico">🔍</div><p>No se encontraron resultados.<br>Intenta con otro nombre o filtro.</p></div>';
      pagWrap.style.display = "none";
      return;
    }

    var shown = list;
    var needsPag = !searchMode && list.length > PER_PAGE;

    if (needsPag) {
      var start = (currentPage - 1) * PER_PAGE;
      shown = list.slice(start, start + PER_PAGE);
      var totalPags = Math.ceil(list.length / PER_PAGE);
      document.getElementById("btnPrev").disabled = currentPage <= 1;
      document.getElementById("btnNext").disabled = currentPage >= totalPags;
      document.getElementById("pageInfo").textContent = currentPage + " / " + totalPags;
      pagWrap.style.display = "flex";
    } else {
      pagWrap.style.display = "none";
    }

    var countText = list.length + " persona(s)";
    if (needsPag) {
      var s = (currentPage - 1) * PER_PAGE + 1;
      var en = Math.min(currentPage * PER_PAGE, list.length);
      countText += " — mostrando " + s + "–" + en;
    }

    var html = '<p class="list-count">' + countText + "</p>";

    shown.forEach(function(p) {
      var isSel = selectedIds.has(p.id);
      var cls = "person-card " + (p.entregada ? "entregada" : isSel ? "selected" : "pendiente");
      var check = (p.entregada || isSel) ? "✓" : "";
      var tag = p.entregada
        ? '<span class="person-tag tag-done">✅ OK</span>'
        : '<span class="person-tag tag-pending">⏳</span>';
      var delivery = p.entregada
        ? '<div class="delivery-info">✓ ' + esc(p.entregadaPor || "?") + " · " + esc(p.fechaEntrega || "") + "</div>"
        : "";
      var click = p.entregada ? "" : 'onclick="toggleSelect(\'' + p.id.replace(/'/g, "\\'") + '\')"';
      var safeId = p.id.replace(/[^a-zA-Z0-9_-]/g, "_");

      html += '<div class="' + cls + '" id="c_' + safeId + '" ' + click + '>' +
        '<div class="checkbox">' + check + '</div>' +
        '<div class="person-info">' +
          '<div class="person-name">' + esc(p.nombre) + '</div>' +
          '<div class="person-meta">' + esc(p.ciudad) + (p.tipo ? " · " + esc(p.tipo) : "") + '</div>' +
          delivery +
        '</div>' +
        tag +
        '</div>';
    });

    container.innerHTML = html;
  }

  function changePage(d) {
    currentPage += d;
    applyFilterAndRender();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ===== SELECTION =====
  function toggleSelect(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    updateFab();

    var safeId = id.replace(/[^a-zA-Z0-9_-]/g, "_");
    var card = document.getElementById("c_" + safeId);
    if (!card) return;
    var isSel = selectedIds.has(id);
    card.className = "person-card " + (isSel ? "selected" : "pendiente");
    card.querySelector(".checkbox").textContent = isSel ? "✓" : "";
  }

  function clearSelection() {
    selectedIds.clear();
    updateFab();
    applyFilterAndRender();
  }

  function updateFab() {
    var n = selectedIds.size;
    document.getElementById("fabCount").textContent = n;
    document.getElementById("fabBar").classList.toggle("visible", n > 0);
  }

  // ===== DELIVER =====
  async function entregarSeleccionados() {
    if (!selectedIds.size) return;
    if (!SCRIPT_URL) { showToast("Error de configuracion.", "error"); return; }

    var btn = document.getElementById("btnDeliver");
    btn.disabled = true;
    btn.textContent = "Guardando... ⏳";

    var personas = [];
    selectedIds.forEach(function(id) {
      var p = allPersons.find(function(x){ return x.id === id; });
      if (p) personas.push({ hoja: p.hoja, fila: p.fila });
    });

    try {
      var res = await callScript({ action: "entregar", personas: personas, colaborador: COLAB_NAME });
      if (res.ok || (res.entregadas && res.entregadas.length > 0)) {
        var count = res.entregadas ? res.entregadas.length : personas.length;
        showToast("✅ " + count + " pulsera(s) entregada(s)!", "success");
        selectedIds.clear();
        updateFab();
        await loadAll();
      } else {
        showToast("Error: " + (res.error || "no se pudo guardar"), "error");
      }
    } catch(e) {
      showToast("Error de conexion al guardar.", "error");
    }

    btn.disabled = false;
    btn.textContent = "✅ Entregar Pulsera(s)";
  }

  // ===== STATS =====
  function updateStats() {
    document.getElementById("statEntregadas").textContent =
      estadisticas.totalEntregadas !== undefined ? estadisticas.totalEntregadas : "-";
    document.getElementById("statPendientes").textContent =
      estadisticas.totalPendientes !== undefined ? estadisticas.totalPendientes : "-";
  }

  // ===== UTILS =====
  async function callScript(body) {
    var r = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(Object.assign({}, body, { evento: EVENTO_CLAVE, token: TOKEN }))
    });
    return r.json();
  }

  function showLoading() {
    document.getElementById("loadingWrap").style.display = "flex";
    document.getElementById("personList").innerHTML = "";
    document.getElementById("paginationWrap").style.display = "none";
  }
  function hideLoading() {
    document.getElementById("loadingWrap").style.display = "none";
  }
  function showError(msg) {
    hideLoading();
    document.getElementById("personList").innerHTML =
      '<div class="empty-state"><div class="ico">⚠️</div><p>' + msg + '</p></div>';
  }

  var toastTimer;
  function showToast(msg, type) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast" + (type ? " " + type : "");
    clearTimeout(toastTimer);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { t.classList.add("show"); });
    });
    toastTimer = setTimeout(function() { t.classList.remove("show"); }, 3200);
  }

  function esc(s) {
    return String(s || "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
</body>
</html>
